name: Version Consistency

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need tags for comparisons

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install -o /tmp/bun.sh && bash /tmp/bun.sh "bun-v1.3.13" && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Verify package version matches tag
        run: bun scripts/check-version-tag.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
